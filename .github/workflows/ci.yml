name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Generated JSON Schema is up to date
        run: |
          npm run schemas
          git add -A -- packages/core/schema
          git diff --cached --exit-code -- packages/core/schema
      - name: The book is not left behind
        if: github.event_name == 'pull_request'
        env:
          DOMAINBOOK_BASE: ${{ github.event.pull_request.base.sha }}
          DOMAINBOOK_HEAD: ${{ github.event.pull_request.head.sha }}
          DOMAINBOOK_CLI: node packages/cli/dist/bin.js
        run: ./integrations/action/run.sh
      - name: A publishable change carries a changeset
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=${{ github.event.pull_request.base.sha }}
      - name: No high or critical vulnerabilities
        run: npm audit --audit-level=high --package-lock-only
      - name: No duplicated code above threshold
        run: npm run duplication
